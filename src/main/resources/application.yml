spring:
    application:
        name: house
    datasource:
        driverClassName: org.h2.Driver
        password: ''
        url: jdbc:h2:mem:pet-house
        username: sa
    h2:
        console:
            enabled: true
            path: /h2-console
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format-sql: true
        show-sql: true
    info:
        app:
            description: '@project.description@'
            encoding: '@project.build.sourceEncoding@'
            java:
                version: '@java.version@'
            name: '@project.name@'
            version: '@project.version@'
    management:
        endpoint:
            health:
                show-details: always
        endpoints:
            web:
                exposure:
                    include: '*'
